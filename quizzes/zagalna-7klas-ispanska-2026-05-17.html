<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математична фієста — 7 клас (програма іспанської школи)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
    background: linear-gradient(135deg, #ffd54f 0%, #ff7043 50%, #c62828 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #2c3e50;
  }

  .container {
    background: #fffaf0;
    border-radius: 24px;
    padding: 32px;
    max-width: 680px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg, #c62828 33%, #ffd54f 33% 66%, #c62828 66%);
  }

  .lang-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .lang-label {
    color: #7f8c8d;
    font-size: 0.9em;
  }

  .lang-select {
    font-family: inherit;
    font-size: 0.95em;
    padding: 6px 10px;
    border-radius: 8px;
    border: 2px solid #ffcc80;
    background: white;
    cursor: pointer;
    color: #2c3e50;
  }

  .lang-select:focus {
    outline: none;
    border-color: #ff7043;
  }

  h1 {
    text-align: center;
    color: #c62828;
    font-size: 1.9em;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: #7f8c8d;
    margin-bottom: 24px;
    font-size: 1em;
  }

  .start-screen, .result-screen {
    text-align: center;
    padding: 8px;
  }

  .emoji-big {
    font-size: 4em;
    margin: 16px 0;
    display: block;
  }

  .btn {
    background: linear-gradient(135deg, #ff7043, #c62828);
    color: white;
    border: none;
    padding: 16px 32px;
    font-size: 1.1em;
    border-radius: 16px;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
    box-shadow: 0 6px 18px rgba(198, 40, 40, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 16px;
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 22px rgba(198, 40, 40, 0.5);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-weight: bold;
    color: #c62828;
    font-size: 0.95em;
    flex-wrap: wrap;
    gap: 8px;
  }

  .timer-badge {
    background: #fff3e0;
    padding: 4px 12px;
    border-radius: 10px;
    color: #c62828;
    font-variant-numeric: tabular-nums;
    font-weight: bold;
  }

  .progress-bar {
    background: #fff3e0;
    border-radius: 12px;
    height: 14px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    background: linear-gradient(90deg, #ffd54f, #ff7043);
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 12px;
  }

  .question-text {
    font-size: 1.2em;
    line-height: 1.5;
    margin: 20px 0 24px 0;
    padding: 16px;
    background: #fff3e0;
    border-radius: 12px;
    border-left: 5px solid #ff7043;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: white;
    border: 2px solid #ffcc80;
    padding: 14px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.05em;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
    color: #2c3e50;
  }

  .option:hover:not(:disabled) {
    background: #fff3e0;
    border-color: #ff7043;
    transform: translateX(4px);
  }

  .option:disabled { cursor: not-allowed; }

  .option.correct {
    background: #c8e6c9;
    border-color: #2e7d32;
    color: #1b5e20;
    font-weight: bold;
  }

  .option.wrong {
    background: #ffcdd2;
    border-color: #c62828;
    color: #b71c1c;
  }

  .feedback {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    font-size: 1em;
    line-height: 1.5;
    animation: slideIn 0.3s ease;
  }

  .feedback.correct {
    background: #c8e6c9;
    color: #1b5e20;
    border-left: 5px solid #2e7d32;
  }

  .feedback.wrong {
    background: #ffcdd2;
    color: #b71c1c;
    border-left: 5px solid #c62828;
  }

  .feedback-title {
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 1.05em;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .grade-badge {
    font-size: 5em;
    font-weight: bold;
    color: #c62828;
    margin: 16px 0;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
  }

  .result-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    margin: 10px 0;
  }

  .score-info {
    font-size: 1.15em;
    color: #2c3e50;
  }

  .motivation {
    font-style: italic;
    color: #5d4037;
    margin: 20px 0;
    padding: 14px;
    background: #fff3e0;
    border-radius: 12px;
    font-size: 1.05em;
  }

  .hidden { display: none; }

  .input-answer {
    width: 100%;
    padding: 14px;
    font-size: 1.1em;
    border: 2px solid #ffcc80;
    border-radius: 12px;
    margin-bottom: 12px;
    font-family: inherit;
  }

  .input-answer:focus {
    outline: none;
    border-color: #ff7043;
  }

  .checkbox-pair {
    display: flex;
    gap: 12px;
  }

  .checkbox-pair .option {
    flex: 1;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="container">

  <div class="lang-bar">
    <span class="lang-label" id="lang-label">Мова:</span>
    <select class="lang-select" id="lang-select" onchange="setLanguage(this.value)">
      <option value="uk">🇺🇦 Українська</option>
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
    </select>
  </div>

  <!-- Start screen -->
  <div id="start-screen" class="start-screen">
    <h1 id="start-title"></h1>
    <p class="subtitle" id="start-subtitle"></p>
    <span class="emoji-big">📐🎉</span>
    <p id="start-intro1" style="font-size: 1.1em; line-height: 1.6; margin-bottom: 8px;"></p>
    <p id="start-intro2" style="color: #7f8c8d;"></p>
    <button class="btn" id="start-btn" onclick="startQuiz()"></button>
  </div>

  <!-- Quiz screen -->
  <div id="quiz-screen" class="hidden">
    <h1 id="quiz-title"></h1>
    <div class="progress-info">
      <span id="progress-text"></span>
      <span class="timer-badge" id="timer">⏱️ 00:00</span>
      <span id="score-text"></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 10%"></div>
    </div>

    <div class="question-text" id="question-text"></div>
    <div class="options" id="options-container"></div>
    <div id="feedback-container"></div>

    <div id="next-button-container" style="text-align: center;"></div>
  </div>

  <!-- Result screen -->
  <div id="result-screen" class="hidden result-screen">
    <h1 id="result-title"></h1>
    <span class="emoji-big" id="result-emoji">🎉</span>
    <div class="result-meta">
      <div class="score-info"><span id="result-correct-label"></span> <strong id="result-correct"></strong> <span id="result-of-total"></span></div>
      <div class="score-info"><span id="result-percent-label"></span> <strong id="result-percent"></strong></div>
      <div class="score-info"><span id="result-time-label"></span> <strong id="result-time"></strong></div>
    </div>
    <div style="margin-top: 16px;" id="result-grade-label"></div>
    <div class="grade-badge" id="result-grade">12</div>
    <div class="motivation" id="result-motivation"></div>
    <button class="btn" id="result-restart-btn" onclick="restartQuiz()"></button>
  </div>

</div>

// ============ State ============
let currentLang = 'uk';
let currentQuestion = 0;
let score = 0;
let answered = false;
let selectedIdx = null;
let userInputValue = null;
let wasCorrect = false;
let quizStartTime = null;
let timerInterval = null;
let finalElapsedSec = null;

function t() { return i18n[currentLang]; }

function fmt(str, vars) {
  return str.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ============ Rendering ============
function setLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = t().htmlLang;
  document.getElementById('lang-select').value = lang;
  renderStart();
  renderQuizChrome();
  if (!document.getElementById('quiz-screen').classList.contains('hidden')) {
    if (answered) {
      renderQuestionShell();
      restoreAnsweredView();
    } else {
      renderQuestion();
    }
  }
  if (!document.getElementById('result-screen').classList.contains('hidden')) {
    renderResult();
  }
}

function renderStart() {
  document.getElementById('lang-label').textContent = t().langLabel;
  document.getElementById('start-title').textContent = t().pageTitleHeading;
  document.getElementById('start-subtitle').textContent = t().subtitle;
  document.getElementById('start-intro1').innerHTML = t().intro1;
  document.getElementById('start-intro2').innerHTML = t().intro2;
  document.getElementById('start-btn').textContent = t().startBtn;
}

function renderQuizChrome() {
  document.getElementById('quiz-title').textContent = t().quizTitleHeading;
}

function startQuiz() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  currentQuestion = 0;
  score = 0;
  finalElapsedSec = null;
  quizStartTime = Date.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 250);
  updateTimer();
  renderQuizChrome();
  renderQuestion();
}

function updateTimer() {
  if (quizStartTime === null) return;
  const elapsed = Math.floor((Date.now() - quizStartTime) / 1000);
  document.getElementById('timer').textContent = '⏱️ ' + formatTime(elapsed);
}

function renderQuestionShell() {
  const q = questions[currentQuestion];
  document.getElementById('question-text').innerHTML = q.text[currentLang];
  document.getElementById('progress-text').textContent =
    fmt(t().progressLabel, { n: currentQuestion + 1, total: questions.length });
  document.getElementById('score-text').textContent =
    fmt(t().scoreLabel, { n: score });
  document.getElementById('progress-fill').style.width =
    `${((currentQuestion + 1) / questions.length) * 100}%`;
}

function renderQuestion() {
  answered = false;
  selectedIdx = null;
  userInputValue = null;
  wasCorrect = false;

  renderQuestionShell();
  document.getElementById('feedback-container').innerHTML = '';
  document.getElementById('next-button-container').innerHTML = '';

  const q = questions[currentQuestion];
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';

  if (q.type === 'choice') {
    optionsContainer.className = 'options';
    q.options[currentLang].forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(idx);
      optionsContainer.appendChild(btn);
    });
  } else if (q.type === 'truefalse') {
    optionsContainer.className = 'options checkbox-pair';
    q.options[currentLang].forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = (idx === 0 ? '✅ ' : '❌ ') + opt;
      btn.onclick = () => selectAnswer(idx);
      optionsContainer.appendChild(btn);
    });
  } else if (q.type === 'input') {
    optionsContainer.className = 'options';
    buildInputUI(optionsContainer, '', false);
    document.getElementById('answer-input').focus();
  }
}

function buildInputUI(container, value, locked) {
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'input-answer';
  inp.placeholder = t().inputPlaceholder;
  inp.id = 'answer-input';
  inp.value = value;
  inp.disabled = locked;
  if (locked) {
    inp.style.background = wasCorrect ? '#c8e6c9' : '#ffcdd2';
    inp.style.borderColor = wasCorrect ? '#2e7d32' : '#c62828';
    inp.style.color = wasCorrect ? '#1b5e20' : '#b71c1c';
    inp.style.fontWeight = 'bold';
  } else {
    inp.onkeydown = (e) => { if (e.key === 'Enter') checkInputAnswer(); };
  }
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn';
  submitBtn.textContent = t().submitBtn;
  submitBtn.style.alignSelf = 'center';
  submitBtn.disabled = locked;
  if (!locked) submitBtn.onclick = checkInputAnswer;
  container.appendChild(inp);
  container.appendChild(submitBtn);
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  selectedIdx = idx;
  const q = questions[currentQuestion];
  wasCorrect = (idx === q.correct);
  if (wasCorrect) score++;
  paintChoiceLocked();
  document.getElementById('score-text').textContent =
    fmt(t().scoreLabel, { n: score });
  renderFeedback();
  renderNextButton();
}

function checkInputAnswer() {
  if (answered) return;
  const inp = document.getElementById('answer-input');
  const raw = inp.value.trim();
  if (raw === '') return;
  answered = true;
  userInputValue = raw;
  const normalized = raw.replace(',', '.');
  const q = questions[currentQuestion];
  const userNum = parseFloat(normalized);
  wasCorrect = false;
  if (!isNaN(userNum) && Math.abs(userNum - q.correct) < 0.001) wasCorrect = true;
  if (q.correctAlt && q.correctAlt.includes(raw)) wasCorrect = true;
  if (wasCorrect) score++;
  paintInputLocked();
  document.getElementById('score-text').textContent =
    fmt(t().scoreLabel, { n: score });
  renderFeedback(q.correct);
  renderNextButton();
}

function paintChoiceLocked() {
  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll('#options-container .option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('correct', 'wrong');
    if (i === q.correct) btn.classList.add('correct');
    else if (i === selectedIdx) btn.classList.add('wrong');
  });
}

function paintInputLocked() {
  const inp = document.getElementById('answer-input');
  inp.disabled = true;
  const submitBtn = inp.nextElementSibling;
  if (submitBtn) submitBtn.disabled = true;
  inp.style.background = wasCorrect ? '#c8e6c9' : '#ffcdd2';
  inp.style.borderColor = wasCorrect ? '#2e7d32' : '#c62828';
  inp.style.color = wasCorrect ? '#1b5e20' : '#b71c1c';
  inp.style.fontWeight = 'bold';
}

function renderFeedback(correctValue) {
  const q = questions[currentQuestion];
  const titles = t().correctTitles;
  let title;
  if (wasCorrect) {
    title = titles[Math.floor(Math.random() * titles.length)];
  } else {
    title = t().wrongTitle;
    if (correctValue !== undefined) {
      title += ` ${t().correctAnsPrefix} <strong>${correctValue}</strong>`;
    }
  }
  const feedback = document.createElement('div');
  feedback.className = 'feedback ' + (wasCorrect ? 'correct' : 'wrong');
  feedback.innerHTML = `<div class="feedback-title">${title}</div>${q.explanation[currentLang]}`;
  const cont = document.getElementById('feedback-container');
  cont.innerHTML = '';
  cont.appendChild(feedback);
}

function renderNextButton() {
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = currentQuestion + 1 < questions.length ? t().nextBtn : t().finishBtn;
  btn.onclick = nextQuestion;
  const cont = document.getElementById('next-button-container');
  cont.innerHTML = '';
  cont.appendChild(btn);
}

function restoreAnsweredView() {
  // Re-render answered question in current language, preserving locked state
  const q = questions[currentQuestion];
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';

  if (q.type === 'choice') {
    optionsContainer.className = 'options';
    q.options[currentLang].forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.disabled = true;
      if (idx === q.correct) btn.classList.add('correct');
      else if (idx === selectedIdx) btn.classList.add('wrong');
      optionsContainer.appendChild(btn);
    });
  } else if (q.type === 'truefalse') {
    optionsContainer.className = 'options checkbox-pair';
    q.options[currentLang].forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = (idx === 0 ? '✅ ' : '❌ ') + opt;
      btn.disabled = true;
      if (idx === q.correct) btn.classList.add('correct');
      else if (idx === selectedIdx) btn.classList.add('wrong');
      optionsContainer.appendChild(btn);
    });
  } else if (q.type === 'input') {
    optionsContainer.className = 'options';
    buildInputUI(optionsContainer, userInputValue || '', true);
  }

  const correctValueForInput = q.type === 'input' ? q.correct : undefined;
  renderFeedback(correctValueForInput);
  renderNextButton();
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function getGrade(percent) {
  if (percent >= 95) return 12;
  if (percent >= 88) return 11;
  if (percent >= 80) return 10;
  if (percent >= 73) return 9;
  if (percent >= 66) return 8;
  if (percent >= 59) return 7;
  if (percent >= 50) return 6;
  if (percent >= 41) return 5;
  if (percent >= 33) return 4;
  if (percent >= 25) return 3;
  if (percent >= 13) return 2;
  return 1;
}

function motivationKey(grade) {
  if (grade === 12) return 'perfect';
  if (grade >= 10) return 'great';
  if (grade >= 8) return 'good';
  if (grade >= 6) return 'ok';
  if (grade >= 4) return 'tryAgain';
  return 'dontGiveUp';
}

function getEmoji(grade) {
  if (grade === 12) return '🏆';
  if (grade >= 10) return '🌟';
  if (grade >= 8) return '👍';
  if (grade >= 6) return '💪';
  if (grade >= 4) return '📚';
  return '🌱';
}

function showResult() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  finalElapsedSec = Math.floor((Date.now() - quizStartTime) / 1000);
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  renderResult();
}

function renderResult() {
  const percent = Math.round((score / questions.length) * 100);
  const grade = getGrade(percent);
  document.getElementById('result-title').textContent = t().resultTitle;
  document.getElementById('result-correct-label').textContent = t().correctLabel;
  document.getElementById('result-correct').textContent = score;
  document.getElementById('result-of-total').textContent = fmt(t().ofTotal, { n: questions.length });
  document.getElementById('result-percent-label').textContent = t().percentLabel;
  document.getElementById('result-percent').textContent = percent + '%';
  document.getElementById('result-time-label').textContent = t().timeLabel;
  document.getElementById('result-time').textContent = formatTime(finalElapsedSec || 0);
  document.getElementById('result-grade-label').textContent = t().gradeLabel;
  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-motivation').innerHTML = t().motivations[motivationKey(grade)];
  document.getElementById('result-emoji').textContent = getEmoji(grade);
  document.getElementById('result-restart-btn').textContent = t().restartBtn;
}

function restartQuiz() {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
}

// Init
renderStart();
</script>
