<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L3 — Пропорції / Proportions (7 клас / Year 7)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:linear-gradient(135deg,#0c4a6e 0%,#0891b2 50%,#10b981 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;color:#1e293b}
  .container{background:#fff;border-radius:20px;padding:28px 24px 20px;max-width:760px;width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,0.3);position:relative;overflow:hidden}
  .container::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(90deg,#0c4a6e,#0891b2,#10b981)}
  .lang-bar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
  .lang-btn{background:#f1f5f9;border:1px solid #cbd5e1;padding:5px 12px;border-radius:8px;cursor:pointer;
    font-size:0.85em;font-weight:600;color:#475569;font-family:inherit}
  .lang-btn.active{background:#0c4a6e;color:#fff;border-color:#0c4a6e}
  h1{color:#0c4a6e;font-size:1.5em;margin-bottom:6px;line-height:1.2}
  .subtitle{color:#64748b;font-size:0.95em;margin-bottom:6px}
  .intro{background:#f8fafc;border-left:5px solid #0891b2;padding:14px 16px;border-radius:10px;
    font-size:0.98em;line-height:1.55;margin:12px 0}
  .intro ul{margin:6px 0 0 20px}
  .intro li{padding:2px 0}
  .btn{background:linear-gradient(135deg,#0c4a6e,#0891b2);color:#fff;border:none;
    padding:14px 30px;font-size:1.08em;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);transition:transform .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none}
  .btn:active{transform:translateY(1px)}
  .btn-block{display:block;width:100%;margin-top:14px}
  .btn-next{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 6px 18px rgba(22,163,74,0.4)}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .section-badge{background:#0c4a6e;color:#fff;font-size:0.82em;font-weight:700;padding:5px 12px;border-radius:20px}
  .timer-badge{background:#f1f5f9;color:#0c4a6e;font-weight:700;padding:4px 12px;border-radius:10px;
    font-size:0.9em;font-variant-numeric:tabular-nums}
  .progress-info{text-align:center;color:#475569;font-size:0.9em;font-weight:600;margin-bottom:8px}
  .progress-bar{background:#e2e8f0;border-radius:10px;height:10px;overflow:hidden;margin-bottom:20px}
  .progress-fill{background:linear-gradient(90deg,#0891b2,#10b981);height:100%;transition:width 0.4s ease}
  .question{font-size:1em;line-height:1.55;margin-bottom:6px;color:#64748b}
  .equation{font-size:1.15em;margin:18px 0;color:#0c4a6e;font-weight:600;line-height:1.4;
    padding:14px 16px;background:#f8fafc;border-radius:10px;border-left:4px solid #0891b2}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.options{grid-template-columns:1fr}.equation{font-size:1em}}
  .option{background:#fff;border:2px solid #cbd5e1;padding:18px;border-radius:12px;cursor:pointer;
    font-size:1.3em;font-weight:700;text-align:center;transition:all 0.15s;font-family:inherit;
    color:#1e293b;min-height:60px;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums}
  .option:hover:not(:disabled){background:#f8fafc;border-color:#0891b2;transform:translateY(-2px)}
  .option:disabled{cursor:not-allowed}
  .option.wrong{background:#fef2f2;border-color:#dc2626;color:#991b1b;opacity:0.7}
  .option.correct{background:#f0fdf4;border-color:#16a34a;color:#14532d}
  .feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:1em;line-height:1.55;
    animation:slideIn 0.25s ease}
  .feedback.hint{background:#fffbeb;color:#78350f;border-left:5px solid #f59e0b}
  .feedback.explanation{background:#f0fdf4;color:#14532d;border-left:5px solid #22c55e}
  .feedback-title{font-weight:700;margin-bottom:4px;font-size:0.95em}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .next-area{text-align:center;margin-top:16px}
  .result-screen{text-align:center}
  .result-emoji{font-size:4em;margin:12px 0}
  .grade-badge{font-size:4em;font-weight:800;color:#0c4a6e;margin:8px 0}
  .result-meta{display:flex;flex-direction:column;gap:6px;align-items:center;margin:8px 0}
  .motivation{font-style:italic;color:#0c4a6e;margin:16px 0;padding:14px;background:#f8fafc;border-radius:12px}
  .topic-tag{display:inline-block;background:#f8fafc;color:#0c4a6e;font-weight:700;padding:6px 14px;border-radius:20px;font-size:0.9em;margin:8px 0;border:2px solid #10b981}
  .theory{margin:14px 0;border-radius:10px;background:#f8fafc;border:2px solid #10b981;overflow:hidden}
  .theory summary{cursor:pointer;padding:12px 14px;background:linear-gradient(90deg,#10b981,#0891b2);font-weight:600;color:#fff;font-size:0.98em;list-style:none}
  .theory summary::-webkit-details-marker{display:none}
  .theory summary::before{content:'▸ ';font-size:0.9em;display:inline-block;transition:transform .2s}
  .theory[open] summary::before{transform:rotate(90deg)}
  .theory-body{padding:14px;display:flex;flex-direction:column;gap:12px}
  .theory-section{background:#fff;border-radius:8px;padding:12px;border-left:4px solid #0891b2}
  .theory-title{font-weight:700;color:#0c4a6e;font-size:1.02em;margin-bottom:8px}
  .rule-note{margin-top:8px;padding:8px 10px;background:#fefce8;border-radius:6px;font-size:0.92em;color:#713f12}
  .example{padding:5px 0;font-size:0.95em;line-height:1.5}
  .example b{color:#0c4a6e}
  .hidden{display:none}
</style>
</head>
<body>
<div class="container">

  <div class="lang-bar">
    <button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">🇺🇦 UA</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
  </div>

  <div id="start-screen">
    <h1 data-i18n="title"></h1>
    <div class="subtitle" data-i18n="subtitle"></div>
    <div class="intro" data-i18n-html="intro"></div>
    <details class="theory" open>
      <summary data-i18n="theoryToggle"></summary>
      <div class="theory-body" data-i18n-html="theory"></div>
    </details>
    <button class="btn btn-block" onclick="startQuiz()" data-i18n="startBtn"></button>
  </div>

  <div id="quiz-screen" class="hidden">
    <div class="topline">
      <span class="section-badge" id="section-badge"></span>
      <span class="timer-badge" id="timer">⏱️ 00:00</span>
    </div>
    <div class="progress-info" id="progress"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="question" data-i18n="solvePrompt"></div>
    <div class="equation" id="equation"></div>
    <div class="options" id="options"></div>
    <div id="feedback"></div>
    <div class="next-area" id="next-area"></div>
  </div>

  <div id="result-screen" class="hidden">
    <div class="result-screen">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <h1 data-i18n="doneTitle"></h1>
      <div class="topic-tag" data-i18n="topicTag"></div>
      <div class="grade-badge" id="result-grade">12</div>
      <div class="result-meta">
        <div><span data-i18n="firstTryLabel"></span>: <b id="result-correct">0</b> <span data-i18n="ofLabel"></span> 30</div>
        <div><span data-i18n="scoreLabel"></span>: <b id="result-percent">0</b>%</div>
        <div><span data-i18n="timeLabel"></span>: <b id="result-time">00:00</b></div>
      </div>
      <div class="motivation" id="motivation"></div>
      <button class="btn btn-block" onclick="restart()" data-i18n="retryBtn"></button>
    </div>
  </div>

</div>

<script>
var TASKS = [{"block": "A", "variations": [{"eq": {"uk": "3 яблука коштують 12 грн. Скільки коштує 5 яблук?", "en": "3 apples cost 12. How much do 5 apples cost?"}, "ans": "20", "dist": ["25", "22", "40"]}, {"eq": {"uk": "4 яблука коштують 20 грн. Скільки коштує 7 яблук?", "en": "4 apples cost 20. How much do 7 apples cost?"}, "ans": "35", "dist": ["30", "40", "33"]}, {"eq": {"uk": "6 яблук коштують 18 грн. Скільки коштує 10 яблук?", "en": "6 apples cost 18. How much do 10 apples cost?"}, "ans": "30", "dist": ["40", "15", "25"]}], "hint": {"uk": "Чим більше — тим більше (пряма пропорція). Знайди скільки на ОДИНИЦЮ, потім помнож.", "en": "More → more (direct proportion). Find the price/amount per ONE unit, then multiply."}, "explain": {"uk": "Поділи вартість на кількість → отримаєш ціну за 1 → помнож на нову кількість.", "en": "Divide cost by quantity → get price per unit → multiply by new quantity."}}, {"block": "A", "variations": [{"eq": {"uk": "Друкар за 4 год друкує 60 сторінок. Скільки за 6 годин?", "en": "A printer prints 60 pages in 4 hours. How many in 6 hours?"}, "ans": "90", "dist": ["85", "100", "89"]}, {"eq": {"uk": "Друкар за 5 год друкує 80 сторінок. Скільки за 8 годин?", "en": "A printer prints 80 pages in 5 hours. How many in 8 hours?"}, "ans": "128", "dist": ["126", "256", "123"]}, {"eq": {"uk": "Друкар за 3 год друкує 45 сторінок. Скільки за 7 годин?", "en": "A printer prints 45 pages in 3 hours. How many in 7 hours?"}, "ans": "105", "dist": ["115", "107", "110"]}], "hint": {"uk": "Чим більше годин — тим більше сторінок.", "en": "More hours → more pages (printing rate stays constant)."}, "explain": {"uk": "Знайди швидкість друку за 1 год, помнож на нову кількість годин.", "en": "Find pages-per-hour, then multiply by the new number of hours."}}, {"block": "A", "variations": [{"eq": {"uk": "На 5 учнів — 25 зошитів. На 8 учнів — скільки?", "en": "For 5 students — 25 notebooks. For 8 students — how many?"}, "ans": "40", "dist": ["35", "42", "45"]}, {"eq": {"uk": "На 4 учнів — 32 зошити. На 7 учнів — скільки?", "en": "For 4 students — 32 notebooks. For 7 students — how many?"}, "ans": "56", "dist": ["51", "46", "54"]}, {"eq": {"uk": "На 6 учнів — 18 зошитів. На 9 учнів — скільки?", "en": "For 6 students — 18 notebooks. For 9 students — how many?"}, "ans": "27", "dist": ["28", "22", "32"]}], "hint": {"uk": "На скількох — стільки ресурсу. Пряма пропорція.", "en": "Per person — direct proportion."}, "explain": {"uk": "Поділи зошити на учнів → стільки на 1 учня → помнож на нову кількість.", "en": "Divide notebooks by students → per-student → multiply by new student count."}}, {"block": "A", "variations": [{"eq": {"uk": "Машина їде 60 км/год. Скільки км за 90 хвилин?", "en": "A car goes 60 km/h. How many km in 90 minutes?"}, "ans": "90", "dist": ["85", "100", "88"]}, {"eq": {"uk": "Машина їде 80 км/год. Скільки км за 75 хвилин?", "en": "A car goes 80 km/h. How many km in 75 minutes?"}, "ans": "100", "dist": ["101", "105", "110"]}, {"eq": {"uk": "Машина їде 50 км/год. Скільки км за 2.5 години?", "en": "A car goes 50 km/h. How many km in 2.5 hours?"}, "ans": "125", "dist": ["250", "62.5", "126"]}], "hint": {"uk": "Швидкість постійна — відстань пропорційна часу.", "en": "Speed constant — distance is proportional to time."}, "explain": {"uk": "Знайди скільки км за 1 хв (год), помнож на новий час.", "en": "Find km per minute (hour), multiply by the new time."}}, {"block": "A", "variations": [{"eq": {"uk": "1 дюйм = 2.54 см. Скільки см у 10 дюймах?", "en": "1 inch = 2.54 cm. How many cm in 10 inches?"}, "ans": "25.4", "dist": ["15.4", "12.7", "50.8"]}, {"eq": {"uk": "1 дюйм = 2.54 см. Скільки см у 5 дюймах?", "en": "1 inch = 2.54 cm. How many cm in 5 inches?"}, "ans": "12.7", "dist": ["25.4", "6.35", "13.7"]}, {"eq": {"uk": "1 дюйм = 2.54 см. Скільки см у 20 дюймах?", "en": "1 inch = 2.54 cm. How many cm in 20 inches?"}, "ans": "50.8", "dist": ["40.8", "49.8", "51.8"]}], "hint": {"uk": "Конвертація одиниць — пряма пропорція.", "en": "Unit conversion — direct proportion."}, "explain": {"uk": "1 дюйм = 2.54 см. Помнож кількість дюймів на 2.54.", "en": "1 inch = 2.54 cm. Multiply the number of inches by 2.54."}}, {"block": "A", "variations": [{"eq": {"uk": "З 3 кг борошна — 60 пиріжків. З 7 кг — скільки?", "en": "From 3 kg of flour — 60 pies. From 7 kg — how many?"}, "ans": "140", "dist": ["70", "141", "135"]}, {"eq": {"uk": "З 4 кг борошна — 48 пиріжків. З 9 кг — скільки?", "en": "From 4 kg of flour — 48 pies. From 9 kg — how many?"}, "ans": "108", "dist": ["54", "107", "98"]}, {"eq": {"uk": "З 5 кг борошна — 75 пиріжків. З 8 кг — скільки?", "en": "From 5 kg of flour — 75 pies. From 8 kg — how many?"}, "ans": "120", "dist": ["115", "110", "118"]}], "hint": {"uk": "Більше борошна — більше виробу (пряма).", "en": "More flour → more pastries (direct)."}, "explain": {"uk": "Знайди скільки виробу з 1 кг борошна, помнож на нову кількість.", "en": "Pastries per 1 kg, then multiply by new kg."}}, {"block": "A", "variations": [{"eq": {"uk": "100 г каші = 350 ккал. Скільки ккал у 150 г?", "en": "100 g of porridge = 350 kcal. How many kcal in 150 g?"}, "ans": "525", "dist": ["520", "1050", "535"]}, {"eq": {"uk": "100 г каші = 280 ккал. Скільки ккал у 250 г?", "en": "100 g of porridge = 280 kcal. How many kcal in 250 g?"}, "ans": "700", "dist": ["705", "1400", "702"]}, {"eq": {"uk": "200 г каші = 600 ккал. Скільки ккал у 150 г?", "en": "200 g of porridge = 600 kcal. How many kcal in 150 g?"}, "ans": "450", "dist": ["448", "452", "460"]}], "hint": {"uk": "Калорії пропорційні масі.", "en": "Calories scale with mass."}, "explain": {"uk": "Поділи ккал на грами → ккал на 1 г → помнож на нову масу.", "en": "kcal ÷ grams → kcal per gram → × new mass."}}, {"block": "A", "variations": [{"eq": {"uk": "5 робітників фарбують 30 м² за день. 8 робітників — скільки?", "en": "5 workers paint 30 m² per day. 8 workers — how much?"}, "ans": "48", "dist": ["53", "96", "47"]}, {"eq": {"uk": "4 робітники фарбують 24 м² за var I18N = {"uk": {"title": "🔵 L3 — Пропорції та правило трьох", "subtitle": "7 клас · 30 задач · 3 блоки × 10 · regla de tres", "intro": "30 задач на пропорції — фундамент для відсотків, рецептів, карт, швидкості та задач на роботу:<ul><li>🟦 <b>Block A — Пряма пропорція:</b> «більше → більше» (ціна, продуктивність, конвертація одиниць).</li><li>🟢 <b>Block B — Обернена пропорція:</b> «більше → менше» (робітники × дні, швидкість × час).</li><li>🌊 <b>Block C — Відношення та масштаб:</b> карти, рецепти, поділ a:b:c.</li><li>💡 Неправильно → підказка з методом, спробуй ще. Бал тільки за з 1-го разу.</li><li>🎲 Числа змінюються щоразу — можна переграти.</li></ul>", "theoryToggle": "📘 Коротка теорія — як працюють пропорції", "theory": "<div class=\"theory-section\"><div class=\"theory-title\">1️⃣ Пряма пропорція</div><div class=\"example\">Більше → більше. Якщо <b>3 яблука = 12 грн</b>, то <b>1 яблуко = 4 грн</b>, <b>5 яблук = 20 грн</b>.</div><div class=\"example\">Формула: <b>a → b</b> та <b>c → x</b> → <b>x = (b·c)/a</b>.</div></div><div class=\"theory-section\"><div class=\"theory-title\">2️⃣ Обернена пропорція</div><div class=\"example\">Більше робітників — МЕНШЕ часу. <b>a·b = c·x</b> → <b>x = (a·b)/c</b>.</div><div class=\"example\">Приклад: 5·24 = 6·x → x = 20.</div></div><div class=\"theory-section\"><div class=\"theory-title\">3️⃣ Як відрізнити</div><div class=\"example\">📈 Обидві ростуть → ПРЯМА.</div><div class=\"example\">📉 Одна росте — інша падає → ОБЕРНЕНА.</div></div><div class=\"theory-section\"><div class=\"theory-title\">4️⃣ Відношення a:b</div><div class=\"example\">Множник = N / (a+b). Хлопців = a × множник.</div></div><div class=\"theory-section\"><div class=\"theory-title\">5️⃣ Масштаб</div><div class=\"example\">1:50000 → 1 см = 0.5 км. 1:25000 → 1 см = 250 м.</div></div>", "startBtn": "🚀 Почати", "blockLabel": "Блок", "questionLabel": "Запитання", "ofLabel": "з", "solvePrompt": "Розвʼяжи задачу:", "doneTitle": "Готово!", "topicTag": "📚 L3 · Пропорці er falls → INVERSE.</div></div><div class=\"theory-section\"><div class=\"theory-title\">4️⃣ Ratio a:b</div><div class=\"example\">Multiplier = N ÷ (a+b). Boys = a × multiplier.</div></div><div class=\"theory-section\"><div class=\"theory-title\">5️⃣ Scale</div><div class=\"example\">1:50000 → 1 cm = 0.5 km. 1:25000 → 1 cm = 250 m.</div></div>", "startBtn": "🚀 Start", "blockLabel": "Block", "questionLabel": "Question", "ofLabel": "of", "solvePrompt": "Solve:", "doneTitle": "Done!", "topicTag": "📚 L3 · Proportions & Rule of Three · Year 7", "firstTryLabel": "First-try correct", "scoreLabel": "Score", "timeLabel": "Time", "retryBtn": "🔄 Try again (new numbers)", "nextBtn": "Next →", "resultBtn": "🏁 Result", "correctTitle": "✅ Correct!", "hintTitle": "💡 Hint", "motiv": {"12": "Flawless! Proportions on autopilot.", "10": "Great! Almost all on first try.", "8": "Solid. Re-read block B (inverse) and try again.", "6": "Not bad. Mind the difference: direct vs inverse.", "4": "Re-read the theory and replay — numbers change.", "0": "Slow down. Ask: \"do both grow, or does one fall?\""}}};
var currentLang = 'uk';

function setLang(l) {
  currentLang = l;
  document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('active', b.getAttribute('data-lang')===l);});
  document.documentElement.setAttribute('lang', l);
  applyI18n();
  // Re-render current question if quiz screen visible
  if (!document.getElementById('quiz-screen').classList.contains('hidden')) {
    renderQuestion();
  }
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    el.textContent = I18N[currentLang][key] || '';
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){
    var key = el.getAttribute('data-i18n-html');
    el.innerHTML = I18N[currentLang][key] || '';
  });
}

var current=0, firstTry=0, attemptedWrong=false, answered=false, wrongIdx={};
var runtime=[], quizStart=null, timerInt=null, finalSec=null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildRuntime(){runtime=[];TASKS.forEach(function(t){
  var vi = Math.floor(Math.random()*t.variations.length);
  var v=t.variations[vi];
  var options=[{n:v.ans,correct:true}]; v.dist.forEach(function(d){options.push({n:d,correct:false});});
  shuffle(options); var ci=0;for(var i=0;i<options.length;i++)if(options[i].correct){ci=i;break;}
  runtime.push({block:t.block, vi:vi, taskIdx:TASKS.indexOf(t), options:options, correctIdx:ci});
});}
function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
function updateTimer(){if(quizStart===null)return;document.getElementById('timer').textContent='⏱️ '+fmtTime(Math.floor((Date.now()-quizStart)/1000));}
function startQuiz(){buildRuntime();current=0;firstTry=0;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  quizStart=Date.now();if(timerInt)clearInterval(timerInt);
  timerInt=setInterval(updateTimer,250);updateTimer();renderQuestion();}
function renderQuestion(){attemptedWrong=false;answered=false;wrongIdx={};
  var rt=runtime[current];
  var task = TASKS[rt.taskIdx];
  var v = task.variations[rt.vi];
  document.getElementById('section-badge').textContent=I18N[currentLang].blockLabel+' '+rt.block;
  document.getElementById('progress').textContent=I18N[currentLang].questionLabel+' '+(current+1)+' '+I18N[currentLang].ofLabel+' '+runtime.length;
  document.getElementById('progress-fill').style.width=(((current+1)/runtime.length)*100)+'%';
  document.getElementById('equation').textContent=v.eq[currentLang]||v.eq.uk;
  var oc=document.getElementById('options');oc.innerHTML='';
  rt.options.forEach(function(o,idx){var btn=document.createElement('button');btn.className='option';btn.textContent=o.n;btn.onclick=function(){selectOption(idx,btn);};oc.appendChild(btn);});
  document.getElementById('feedback').innerHTML='';document.getElementById('next-area').innerHTML='';}
function selectOption(idx,btn){if(answered)return;if(wrongIdx[idx])return;
  var rt=runtime[current];
  var task = TASKS[rt.taskIdx];
  if(idx===rt.correctIdx){answered=true;if(!attemptedWrong)firstTry++;
    btn.classList.add('correct');
    document.querySelectorAll('#options .option').forEach(function(b){b.disabled=true;});
    document.getElementById('feedback').innerHTML='<div class="feedback explanation"><div class="feedback-title">'+I18N[currentLang].correctTitle+'</div>'+(task.explain[currentLang]||task.explain.uk)+'</div>';
    showNextBtn();
  }else{wrongIdx[idx]=true;attemptedWrong=true;btn.classList.add('wrong');btn.disabled=true;
    document.getElementById('feedback').innerHTML='<div class="feedback hint"><div class="feedback-title">'+I18N[currentLang].hintTitle+'</div>'+(task.hint[currentLang]||task.hint.uk)+'</div>';}}
function showNextBtn(){var na=document.getElementById('next-area');var b=document.createElement('button');b.className='btn btn-next';b.textContent=(current+1<runtime.length)?I18N[currentLang].nextBtn:I18N[currentLang].resultBtn;b.onclick=nextQuestion;na.appendChild(b);}
function nextQuestion(){current++;if(current<runtime.length)renderQuestion();else showResult();}
function getGrade(p){if(p>=95)return 12;if(p>=88)return 11;if(p>=80)return 10;if(p>=73)return 9;if(p>=66)return 8;if(p>=59)return 7;if(p>=50)return 6;if(p>=41)return 5;if(p>=33)return 4;if(p>=25)return 3;if(p>=13)return 2;return 1;}
function showResult(){if(timerInt)clearInterval(timerInt);finalSec=Math.floor((Date.now()-quizStart)/1000);
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  var pct=Math.round((firstTry/runtime.length)*100);var grade=getGrade(pct);
  document.getElementById('result-correct').textContent=firstTry;
  document.getElementById('result-percent').textContent=pct;
  document.getElementById('result-grade').textContent=grade;
  document.getElementById('result-time').textContent=fmtTime(finalSec);
  var emoji='🌱',motiv='';
  var m = I18N[currentLang].motiv;
  if(grade===12){emoji='🏆';motiv=m[12];}
  else if(grade>=10){emoji='🌟';motiv=m[10];}
  else if(grade>=8){emoji='👍';motiv=m[8];}
  else if(grade>=6){emoji='💪';motiv=m[6];}
  else if(grade>=4){emoji='📚';motiv=m[4];}
  else{emoji='🧠';motiv=m[0];}
  document.getElementById('result-emoji').textContent=emoji;document.getElementById('motivation').innerHTML=motiv;}
function restart(){document.getElementById('result-screen').classList.add('hidden');document.getElementById('start-screen').classList.remove('hidden');}

// Initialize i18n on page load
applyI18n();
</script>
