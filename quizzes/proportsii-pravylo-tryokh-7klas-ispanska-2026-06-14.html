<html lang="en">
<head>
<meta charset="UTF-8">

<title>L3 — Proportions / Пропорції / Proporciones (Year 7 / 7 клас / 1º ESO)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:linear-gradient(135deg,#0c4a6e 0%,#0891b2 50%,#10b981 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;color:#1e293b}
  .container{background:#fff;border-radius:20px;padding:28px 24px 20px;max-width:760px;width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,0.3);position:relative;overflow:hidden}
  .container::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;
    background:linear-gradient(90deg,#0c4a6e,#0891b2,#10b981)}
  .lang-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:12px;margin-top:4px}
  .lang-label{color:#64748b;font-size:0.9em}
  .lang-select{font-family:inherit;font-size:0.95em;padding:6px 10px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;cursor:pointer;color:#1e293b}
  .lang-select:focus{outline:none;border-color:#0c4a6e}
  h1{color:#0c4a6e;font-size:1.5em;margin-bottom:6px;line-height:1.2}
  .subtitle{color:#64748b;font-size:0.95em;margin-bottom:6px}
  .intro{background:#f8fafc;border-left:5px solid #0891b2;padding:14px 16px;border-radius:10px;
    font-size:0.98em;line-height:1.55;margin:12px 0}
  .intro ul{margin:6px 0 0 20px}
  .intro li{padding:2px 0}
  .btn{background:linear-gradient(135deg,#0c4a6e,#0891b2);color:#fff;border:none;
    padding:14px 30px;font-size:1.08em;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);transition:transform .15s,box-shadow .15s;
    -webkit-appearance:none;appearance:none}
  .btn:active{transform:translateY(1px)}
  .btn-block{display:block;width:100%;margin-top:14px}
  .btn-next{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 6px 18px rgba(22,163,74,0.4)}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .section-badge{background:#0c4a6e;color:#fff;font-size:0.82em;font-weight:700;padding:5px 12px;border-radius:20px}
  .timer-badge{background:#f1f5f9;color:#0c4a6e;font-weight:700;padding:4px 12px;border-radius:10px;
    font-size:0.9em;font-variant-numeric:tabular-nums}
  .progress-info{text-align:center;color:#475569;font-size:0.9em;font-weight:600;margin-bottom:8px}
  .progress-bar{background:#e2e8f0;border-radius:10px;height:10px;overflow:hidden;margin-bottom:20px}
  .progress-fill{background:linear-gradient(90deg,#0891b2,#10b981);height:100%;transition:width 0.4s ease}
  .question{font-size:1em;line-height:1.55;margin-bottom:6px;color:#64748b}
  .equation{font-size:1.15em;margin:18px 0;color:#0c4a6e;font-weight:600;line-height:1.4;
    padding:14px 16px;background:#f8fafc;border-radius:10px;border-left:4px solid #0891b2}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.options{grid-template-columns:1fr}.equation{font-size:1em}}
  .option{background:#fff;border:2px solid #cbd5e1;padding:18px;border-radius:12px;cursor:pointer;
    font-size:1.3em;font-weight:700;text-align:center;transition:all 0.15s;font-family:inherit;
    color:#1e293b;min-height:60px;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums}
  .option:hover:not(:disabled){background:#f8fafc;border-color:#0891b2;transform:translateY(-2px)}
  .option:disabled{cursor:not-allowed}
  .option.wrong{background:#fef2f2;border-color:#dc2626;color:#991b1b;opacity:0.7}
  .option.correct{background:#f0fdf4;border-color:#16a34a;color:#14532d}
  .feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:1em;line-height:1.55;
    animation:slideIn 0.25s ease}
  .feedback.hint{background:#fffbeb;color:#78350f;border-left:5px solid #f59e0b}
  .feedback.explanation{background:#f0fdf4;color:#14532d;border-left:5px solid #22c55e}
  .feedback-title{font-weight:700;margin-bottom:4px;font-size:0.95em}

  .next-area{text-align:center;margin-top:16px}
  .result-screen{text-align:center}
  .result-emoji{font-size:4em;margin:12px 0}
  .grade-badge{font-size:4em;font-weight:800;color:#0c4a6e;margin:8px 0}
  .result-meta{display:flex;flex-direction:column;gap:6px;align-items:center;margin:8px 0}
  .motivation{font-style:italic;color:#0c4a6e;margin:16px 0;padding:14px;background:#f8fafc;border-radius:12px}
  .topic-tag{display:inline-block;background:#f8fafc;color:#0c4a6e;font-weight:700;padding:6px 14px;border-radius:20px;font-size:0.9em;margin:8px 0;border:2px solid #10b981}
  .theory{margin:14px 0;border-radius:10px;background:#f8fafc;border:2px solid #10b981;overflow:hidden}
  .theory summary{cursor:pointer;padding:12px 14px;background:linear-gradient(90deg,#10b981,#0891b2);font-weight:600;color:#fff;font-size:0.98em;list-style:none}
  .theory summary::-webkit-details-marker{display:none}
  .theory summary::before{content:'▸ ';font-size:0.9em;display:inline-block;transition:transform .2s}
  .theory[open] summary::before{transform:rotate(90deg)}
  .theory-body{padding:14px;display:flex;flex-direction:column;gap:12px}
  .theory-section{background:#fff;border-radius:8px;padding:12px;border-left:4px solid #0891b2}
  .theory-title{font-weight:700;color:#0c4a6e;font-size:1.02em;margin-bottom:8px}
  .rule-note{margin-top:8px;padding:8px 10px;background:#fefce8;border-radius:6px;font-size:0.92em;color:#713f12}
  .example{padding:5px 0;font-size:0.95em;line-height:1.5}
  .example b{color:#0c4a6e}
  .hidden{display:none}
</style>
</head>
<body>
<div class="container">

  <div class="lang-bar">
    <span class="lang-label" id="lang-label">Language:</span>
    <select class="lang-select" id="lang-select" onchange="setLang(this.value)">

      <option value="uk">🇺🇦 Українська</option>
      <option value="es">🇪🇸 Español</option>

    <div class="question" data-i18n="solvePrompt"></div>
    <div class="equation" id="equation"></div>
    <div class="options" id="options"></div>
    <div id="feedback"></div>
    <div class="next-area" id="next-area"></div>
  </div>

  <div id="result-screen" class="hidden">
    <div class="result-screen">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <h1 data-i18n="doneTitle"></h1>
      <div class="topic-tag" data-i18n="topicTag"></div>
      <div class="grade-badge" id="result-grade">12</div>
      <div class="result-meta">

        <div><span data-i18n="scoreLabel"></span>: <b id="result-percent">0</b>%</div>
        <div><span data-i18n="timeLabel"></span>: <b id="result-time">00:00</b></div>
      </div>
      <div class="motivation" id="motivation"></div>
      <button class="btn btn-block" onclick="restart()" data-i18n="retryBtn"></button>
    </div>
  </div>

</div>

var currentLang = 'en';

function setLang(l) {
  currentLang = l;
  document.documentElement.setAttribute('lang', l);
  document.getElementById('lang-select').value = l;
  document.getElementById('lang-label').textContent = I18N[currentLang].langLabel || 'Language:';
  applyI18n();
  if (!document.getElementById('quiz-screen').classList.contains('hidden')) {
    renderQuestion();
  }
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    el.textContent = I18N[currentLang][key] || I18N.en[key] || '';
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){
    var key = el.getAttribute('data-i18n-html');
    el.innerHTML = I18N[currentLang][key] || I18N.en[key] || '';
  });
}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildRuntime(){runtime=[];TASKS.forEach(function(t,ti){
  var vi = Math.floor(Math.random()*t.variations.length);
  var v=t.variations[vi];
  var options=[{n:v.ans,correct:true}]; v.dist.forEach(function(d){options.push({n:d,correct:false});});
  shuffle(options); var ci=0;for(var i=0;i<options.length;i++)if(options[i].correct){ci=i;break;}
  runtime.push({block:t.block, vi:vi, taskIdx:ti, options:options, correctIdx:ci});
});}
function fmtTime(s){var m=Math.floor(s/60),sec=s%60;return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
function updateTimer(){if(quizStart===null)return;document.getElementById('timer').textContent='⏱️ '+fmtTime(Math.floor((Date.now()-quizStart)/1000));}
function startQuiz(){buildRuntime();current=0;firstTry=0;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  quizStart=Date.now();if(timerInt)clearInterval(timerInt);
  timerInt=setInterval(updateTimer,250);updateTimer();renderQuestion();}
function renderQuestion(){attemptedWrong=false;answered=false;wrongIdx={};
  var rt=runtime[current];
  var task = TASKS[rt.taskIdx];
  var v = task.variations[rt.vi];
  document.getElementById('section-badge').textContent=I18N[currentLang].blockLabel+' '+rt.block;
  document.getElementById('progress').textContent=I18N[currentLang].questionLabel+' '+(current+1)+' '+I18N[currentLang].ofLabel+' '+runtime.length;
  document.getElementById('progress-fill').style.width=(((current+1)/runtime.length)*100)+'%';
  document.getElementById('equation').textContent=v.eq[currentLang]||v.eq.en||v.eq.uk;
  var oc=document.getElementById('options');oc.innerHTML='';
  rt.options.forEach(function(o,idx){var btn=document.createElement('button');btn.className='option';btn.textContent=o.n;btn.onclick=function(){selectOption(idx,btn);};oc.appendChild(btn);});
  document.getElementById('feedback').innerHTML='';document.getElementById('next-area').innerHTML='';}
function selectOption(idx,btn){if(answered)return;if(wrongIdx[idx])return;
  var rt=runtime[current];
  var task = TASKS[rt.taskIdx];
  if(idx===rt.correctIdx){answered=true;if(!attemptedWrong)firstTry++;
    btn.classList.add('correct');
    document.querySelectorAll('#options .option').forEach(function(b){b.disabled=true;});
    document.getElementById('feedback').innerHTML='<div class="feedback explanation"><div class="feedback-title">'+I18N[currentLang].correctTitle+'</div>'+(task.explain[currentLang]||task.explain.en||task.explain.uk)+'</div>';
    showNextBtn();
  }else{wrongIdx[idx]=true;attemptedWrong=true;btn.classList.add('wrong');btn.disabled=true;
    document.getElementById('feedback').innerHTML='<div class="feedback hint"><div class="feedback-title">'+I18N[currentLang].hintTitle+'</div>'+(task.hint[currentLang]||task.hint.en||task.hint.uk)+'</div>';}}
function showNextBtn(){var na=document.getElementById('next-area');var b=document.createElement('button');b.className='btn btn-next';b.textContent=(current+1<runtime.length)?I18N[currentLang].nextBtn:I18N[currentLang].resultBtn;b.onclick=nextQuestion;na.appendChild(b);}
function nextQuestion(){current++;if(current<runtime.length)renderQuestion();else showResult();}
function getGrade(p){if(p>=95)return 12;if(p>=88)return 11;if(p>=80)return 10;if(p>=73)return 9;if(p>=66)return 8;if(p>=59)return 7;if(p>=50)return 6;if(p>=41)return 5;if(p>=33)return 4;if(p>=25)return 3;if(p>=13)return 2;return 1;}
function showResult(){if(timerInt)clearInterval(timerInt);finalSec=Math.floor((Date.now()-quizStart)/1000);
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  var pct=Math.round((firstTry/runtime.length)*100);var grade=getGrade(pct);
  document.getElementById('result-correct').textContent=firstTry;
  document.getElementById('result-percent').textContent=pct;
  document.getElementById('result-grade').textContent=grade;
  document.getElementById('result-time').textContent=fmtTime(finalSec);
  var emoji='🌱',motiv='';
  var m = I18N[currentLang].motiv;
  if(grade===12){emoji='🏆';motiv=m[12];}
  else if(grade>=10){emoji='🌟';motiv=m[10];}
  else if(grade>=8){emoji='👍';motiv=m[8];}
  else if(grade>=6){emoji='💪';motiv=m[6];}
  else if(grade>=4){emoji='📚';motiv=m[4];}
  else{emoji='🧠';motiv=m[0];}
  document.getElementById('result-emoji').textContent=emoji;document.getElementById('motivation').innerHTML=motiv;}
function restart(){document.getElementById('result-screen').classList.add('hidden');document.getElementById('start-screen').classList.remove('hidden');}

// Initialize on load with default lang
document.getElementById('lang-select').value = 'en';
setLang('en');
</script>
</body>
</html>
