<body>

  <div class="lang-bar">

<script>
// ============ Helpers ============
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
function intItem(x){ return {form:'int', x:x}; }
function setItem(items){ var s=items.slice().sort(function(a,b){return a-b;}); return {form:'set', items:s}; }
function akey(a){
  if(!a) return 'null';
  if(a.form==='int') return 'i:'+a.x;
  if(a.form==='set') return 's:'+a.items.join(',');
  return '';
}
function renderItem(a){
  if(!a) return '?';
  if(a.form==='int') return ''+a.x;
  if(a.form==='set'){
    if(a.items.length===0) return '∅';
    return '{'+a.items.join(', ')+'}';
  }
  return '?';
}
function renderSource(dir, variation){
  if(dir==='gcd'){ if(currentLang==='en') return 'GCD('+variation[0]+', '+variation[1]+') = ?'; if(currentLang==='es') return 'MCD('+variation[0]+', '+variation[1]+') = ?'; return 'НСД('+variation[0]+', '+variation[1]+') = ?'; }
  if(dir==='lcm'){ if(currentLang==='en') return 'LCM('+variation[0]+', '+variation[1]+') = ?'; if(currentLang==='es') return 'MCM('+variation[0]+', '+variation[1]+') = ?'; return 'НСК('+variation[0]+', '+variation[1]+') = ?'; }
  return '<span style="font-size:1.3em">'+variation[0]+'</span>';
}
function divsFromList(n){
  var checks=[2,3,5,9,10], out=[];
  for(var i=0;i<checks.length;i++){ if(n % checks[i] === 0) out.push(checks[i]); }
  return out;
}
function pickDistr(correct, cands){
  var seen={}; if(correct) seen[akey(correct)]=1; var out=[];
  for(var i=0;i<cands.length;i++){
    var c=cands[i]; if(!c) continue;
    if(c.form==='int' && c.x<=0) continue;
    var k=akey(c); if(seen[k]) continue;
    seen[k]=1; out.push(c);
    if(out.length===3) break;
  }
  var pad=0;
  while(out.length<3){
    var fake;
    if(correct && correct.form==='int') fake=intItem(correct.x + 1 + pad);
    else fake=intItem(pad+2);
    if(!seen[akey(fake)]){ seen[akey(fake)]=1; out.push(fake); }
    pad++; if(pad>30) break;
  }
  return {correct:correct, distractors:out};
}

// ============ Generators ============
function gGCD(a, b){
  var g = gcd(a, b), L = lcm(a, b);
  var correct = intItem(g);
  var dists = [
    intItem(L),                     // confused GCD with LCM
    intItem(Math.min(a, b)),        // took the smaller number
    intItem(Math.abs(a-b) || a+b),  // difference
    intItem(Math.max(a, b)),        // took the larger
    intItem(g*2)                    // off by factor
  ];
  return pickDistr(correct, dists);
}
function gLCM(a, b){
  var g = gcd(a, b), L = lcm(a, b);
  var correct = intItem(L);
  var dists = [
    intItem(g),                     // confused LCM with GCD
    intItem(a * b),                 // multiplied (correct only if coprime)
    intItem(a + b),                 // summed
    intItem(Math.max(a, b)),        // took the larger
    intItem(L*2)                    // off by factor
  ];
  return pickDistr(correct, dists);
}
function gDIV(n){
  var actual = divsFromList(n);
  var correct = setItem(actual);
  var all = [2,3,5,9,10];
  var notIn = []; for(var i=0;i<all.length;i++){ if(actual.indexOf(all[i])<0) notIn.push(all[i]); }
  var dists = [];
  // d1: drop one from correct (missed a rule)
  if(actual.length > 0){
    for(var k=0;k<actual.length;k++){
      var dropped = actual.slice(); dropped.splice(k, 1);
      dists.push(setItem(dropped));
    }
  }
  // d2: add a wrong one (applied rule that fails)
  for(var j=0;j<notIn.length;j++){
    var added = actual.slice(); added.push(notIn[j]);
    dists.push(setItem(added));
  }
  // d3: swap (drop one true, add one false) — combo error
  if(actual.length > 0 && notIn.length > 0){
    var swapped = actual.slice(); swapped.splice(0,1); swapped.push(notIn[0]);
    dists.push(setItem(swapped));
  }
  // d4: empty (didn't apply any rule)
  if(actual.length > 0) dists.push(setItem([]));
  return pickDistr(correct, dists);
}
var GEN = { gcd:gGCD, lcm:gLCM, div:gDIV };

// ============ Explanations ============
function explain(dir, variation, lang){
  if(dir==='gcd'){
    var a=variation[0], b=variation[1], g=gcd(a,b);
    // Show one step of Euclidean algorithm
    var step = a + ' mod ' + b + ' = ' + (a%b);
    var eu;
    if(lang==='uk') eu = 'Алгоритм Евкліда: ' + step + ', далі НСД(' + b + ',' + (a%b) + ')... → НСД = <strong>' + g + '</strong>.';
    else if(lang==='en') eu = 'Euclidean algorithm: ' + step + ', then GCD(' + b + ',' + (a%b) + ')... → GCD = <strong>' + g + '</strong>.';
    else eu = 'Algoritmo de Euclides: ' + step + ', luego MCD(' + b + ',' + (a%b) + ')... → MCD = <strong>' + g + '</strong>.';
    if(lang==='uk') return 'НСД('+a+', '+b+') = <strong>'+g+'</strong>. ' + eu + ' <em>Це найбільше число, на яке діляться обидва. Корисно для скорочення дробу '+a+'/'+b+' = '+(a/g)+'/'+(b/g)+'.</em>';
    if(lang==='en') return 'GCD('+a+', '+b+') = <strong>'+g+'</strong>. ' + eu + ' <em>Used to simplify '+a+'/'+b+' to '+(a/g)+'/'+(b/g)+'.</em>';
    return 'MCD('+a+', '+b+') = <strong>'+g+'</strong>. ' + eu + ' <em>Sirve para simplificar '+a+'/'+b+' a '+(a/g)+'/'+(b/g)+'.</em>';
  }
  if(dir==='lcm'){
    var a=variation[0], b=variation[1], g=gcd(a,b), L=lcm(a,b);
    if(lang==='uk') return 'НСК('+a+', '+b+') = '+a+'·'+b+' ÷ НСД('+a+','+b+') = '+(a*b)+' ÷ '+g+' = <strong>'+L+'</strong>. <em>Найменше число, що ділиться на обидва. Корисно як спільний знаменник для '+a+' і '+b+'.</em>';
    if(lang==='en') return 'LCM('+a+', '+b+') = '+a+'·'+b+' ÷ GCD = '+(a*b)+' ÷ '+g+' = <strong>'+L+'</strong>. <em>Useful as common denominator for fractions with '+a+' and '+b+'.</em>';
    return 'MCM('+a+', '+b+') = '+a+'·'+b+' ÷ MCD = '+(a*b)+' ÷ '+g+' = <strong>'+L+'</strong>. <em>Útil como denominador común para '+a+' y '+b+'.</em>';
  }
  // div_check
  var n=variation[0];
  var actual=divsFromList(n);
  var dsum = (''+n).split('').reduce(function(s,d){return s+parseInt(d,10);}, 0);
  var setStr = actual.length === 0 ? '∅' : '{'+actual.join(', ')+'}';
  if(lang==='uk'){
    var ru=[];
    if(n%2===0) ru.push('<b>÷2</b> ✓ (остання цифра парна)');
    if(n%3===0) ru.push('<b>÷3</b> ✓ (сума цифр '+dsum+' ділиться на 3)');
    if(n%5===0) ru.push('<b>÷5</b> ✓ (остання цифра 0 або 5)');
    if(n%9===0) ru.push('<b>÷9</b> ✓ (сума цифр '+dsum+' ділиться на 9)');
    if(n%10===0) ru.push('<b>÷10</b> ✓ (остання цифра 0)');
    return n+' ділиться на: <strong>'+setStr+'</strong>. '+(ru.join('; ')||'жодне правило не спрацьовує')+'.';
  }
  if(lang==='en'){
    var en=[];
    if(n%2===0) en.push('<b>÷2</b> ✓ (last digit even)');
    if(n%3===0) en.push('<b>÷3</b> ✓ (digit sum '+dsum+' divisible by 3)');
    if(n%5===0) en.push('<b>÷5</b> ✓ (last digit 0 or 5)');
    if(n%9===0) en.push('<b>÷9</b> ✓ (digit sum '+dsum+' divisible by 9)');
    if(n%10===0) en.push('<b>÷10</b> ✓ (last digit 0)');
    return n+' is divisible by: <strong>'+setStr+'</strong>. '+(en.join('; ')||'no rule applies')+'.';
  }
  var es=[];
  if(n%2===0) es.push('<b>÷2</b> ✓ (última cifra par)');
  if(n%3===0) es.push('<b>÷3</b> ✓ (suma de cifras '+dsum+' divisible entre 3)');
  if(n%5===0) es.push('<b>÷5</b> ✓ (última cifra 0 o 5)');
  if(n%9===0) es.push('<b>÷9</b> ✓ (suma de cifras '+dsum+' divisible entre 9)');
  if(n%10===0) es.push('<b>÷10</b> ✓ (última cifra 0)');
  return n+' es divisible entre: <strong>'+setStr+'</strong>. '+(es.join('; ')||'ninguna regla aplica')+'.';
}

// ============ i18n ============
var i18n = {
  uk: {
    htmlLang:'uk', langLabel:'Мова:',
    title:'🔢 НСД, НСК, ознаки подільності', quizTitle:'🔢 НСД, НСК, ознаки подільності',
    subtitle:'Фундамент скорочення дробів · 7 клас · 3 розділи · 30 завдань',
    intro:'Привіт! Сьогодні відточуємо <strong>три інструменти</strong>, що лежать в основі скорочення дробів і спільного знаменника:<ul><li>① 🟣 <b>НСД</b> — найбільший спільний дільник (для <i>скорочення</i> дробу)</li><li>② 🟢 <b>НСК</b> — найменше спільне кратне (для <i>спільного знаменника</i>)</li><li>③ 🔵 <b>Ознаки подільності</b> на 2, 3, 5, 9, 10 (щоб швидко бачити дільники)</li></ul>10 завдань на кожну тему — щоб руками і головою дійшло. Бал — за відповідь <strong>з першої спроби</strong>. Числа щоразу нові.',
    startBtn:'🚀 Почати', sectionBadge:'📚 Розділ {s}/3 · {name}', progress:'Питання {n} з {total}',
    hintTitle:'💡 Підказка', explTitle:'✅ Правильно!',
    nextBtn:'Далі →', finishBtn:'🏁 Результат',
    resultTitle:'Готово!', firstLabel:'Правильно з першої спроби:', ofTotal:'з {n}',
    percentLabel:'Відсоток:', gradeLabel:'Оцінка:', timeLabel:'Час:', restartBtn:'🔄 Ще раз (нові числа!)',
    sections:{ gcd:'НСД — для скорочення', lcm:'НСК — для спільного знаменника', div:'Ознаки подільності' },
    instr:{ gcd:'Знайди НСД (найбільший спільний дільник) двох чисел.', lcm:'Знайди НСК (найменше спільне кратне) двох чисел.', div:'На які з чисел {2, 3, 5, 9, 10} ділиться це число?' },
    hints:{
      gcd:'<b>НСД</b> = найбільше число, на яке діляться обидва. Спосіб 1: розкласти кожне на прості множники і взяти спільні. Спосіб 2 (швидше) — <b>алгоритм Евкліда</b>: ділиш більше на менше, потім менше на залишок, поки залишок не стане 0; останній не-нуль і є НСД. ⚠️ Не плутай з НСК!',

  },
  en: {
    htmlLang:'en', langLabel:'Language:',

// ============ State ============
var currentLang='uk', runtime=[], current=0, firstTryCorrect=0, attemptedWrong=false, answeredCorrect=false;
var quizStart=null, timerInt=null, finalSec=null;
function t(){ return i18n[currentLang]; }
function fmt(s,vars){ return s.replace(/\{(\w+)\}/g, function(_,k){ return vars[k]; }); }
function fmtTime(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; } return a; }

function buildRuntime(){
  runtime=[];
  for (var s=0;s<SECTIONS.length;s++){
    var sec=SECTIONS[s];
    for (var ti=0;ti<sec.tasks.length;ti++){
      var task=sec.tasks[ti];
      var vi=Math.floor(Math.random()*task.v.length);
      var variation=task.v[vi];
      var res=GEN[task.dir].apply(null, variation);
      var options=[{item:res.correct, correct:true}];
      for (var k=0;k<res.distractors.length;k++) options.push({item:res.distractors[k], correct:false});
      shuffle(options);
      var correctIdx=0; for (var oi=0;oi<options.length;oi++) if(options[oi].correct) correctIdx=oi;
      runtime.push({ sectionId:sec.id, sectionIdx:s, dir:task.dir, variation:variation, options:options, correctIdx:correctIdx });
    }
  }
}

function setLanguage(lang){
  currentLang=lang; document.documentElement.lang=t().htmlLang; document.getElementById('lang-select').value=lang;
  renderStart();
  if (!document.getElementById('quiz-screen').classList.contains('hidden')) renderQuestion(true);
  if (!document.getElementById('result-screen').classList.contains('hidden')) renderResult();
}
function renderStart(){
  document.getElementById('lang-label').textContent=t().langLabel;
  document.getElementById('start-title').innerHTML=t().title;
  document.getElementById('start-subtitle').textContent=t().subtitle;
  document.getElementById('start-intro').innerHTML=t().intro;
  document.getElementById('start-btn').textContent=t().startBtn;
}
function startQuiz(){
  buildRuntime(); current=0; firstTryCorrect=0; finalSec=null;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  quizStart=Date.now(); if (timerInt) clearInterval(timerInt); timerInt=setInterval(updateTimer,250); updateTimer();
  renderQuestion(false);
}
function updateTimer(){ if(quizStart===null) return; document.getElementById('timer').textContent='⏱️ '+fmtTime(Math.floor((Date.now()-quizStart)/1000)); }

function renderQuestion(keepState){
  var rt=runtime[current];
  if (!keepState){ attemptedWrong=false; answeredCorrect=false; rt.wrongSet={}; }
  document.getElementById('section-badge').textContent=fmt(t().sectionBadge,{s:rt.sectionIdx+1,name:t().sections[rt.sectionId]});
  document.getElementById('progress-text').textContent=fmt(t().progress,{n:current+1,total:runtime.length});
  document.getElementById('progress-fill').style.width=(((current+1)/runtime.length)*100)+'%';
  document.getElementById('question-text').innerHTML=t().instr[rt.dir];
  document.getElementById('expr').innerHTML=renderSource(rt.dir, rt.variation);

  var oc=document.getElementById('options-container'); oc.innerHTML='';
  for (var i=0;i<rt.options.length;i++){
    (function(idx){
      var btn=document.createElement('button'); btn.className='option'; btn.innerHTML=renderItem(rt.options[idx].item);
      if (rt.wrongSet && rt.wrongSet[idx]){ btn.classList.add('wrong'); btn.disabled=true; }
      if (answeredCorrect){ btn.disabled=true; if (idx===rt.correctIdx) btn.classList.add('correct'); }
      btn.onclick=function(){ selectAnswer(idx); };
      oc.appendChild(btn);
    })(i);
  }

  var fb=document.getElementById('feedback-container'); fb.innerHTML='';
  if (answeredCorrect){
    var ex=document.createElement('div'); ex.className='feedback explanation';
    ex.innerHTML='<div class="feedback-title">'+t().explTitle+'</div>'+explain(rt.dir, rt.variation, currentLang);
    fb.appendChild(ex);
  } else if (attemptedWrong){
    var h=document.createElement('div'); h.className='feedback hint';
    h.innerHTML='<div class="feedback-title">'+t().hintTitle+'</div>'+t().hints[rt.dir];
    fb.appendChild(h);
  }

  var na=document.getElementById('next-area'); na.innerHTML='';
  if (answeredCorrect){
    var nb=document.createElement('button'); nb.className='btn btn-next';
    nb.textContent=(current+1<runtime.length)?t().nextBtn:t().finishBtn; nb.onclick=nextQuestion; na.appendChild(nb);
  }
}

function selectAnswer(idx){
  if (answeredCorrect) return;
  var rt=runtime[current];
  if (rt.wrongSet && rt.wrongSet[idx]) return;
  if (idx===rt.correctIdx){ answeredCorrect=true; if (!attemptedWrong) firstTryCorrect++; }
  else { if (!rt.wrongSet) rt.wrongSet={}; rt.wrongSet[idx]=true; attemptedWrong=true; }
  renderQuestion(true);
}
function nextQuestion(){ current++; if (current<runtime.length) renderQuestion(false); else showResult(); }

function getGrade(p){ if(p>=95)return 12; if(p>=88)return 11; if(p>=80)return 10; if(p>=73)return 9; if(p>=66)return 8; if(p>=59)return 7; if(p>=50)return 6; if(p>=41)return 5; if(p>=33)return 4; if(p>=25)return 3; if(p>=13)return 2; return 1; }
function motivKey(g){ if(g===12)return 'perfect'; if(g>=10)return 'great'; if(g>=8)return 'good'; if(g>=6)return 'ok'; if(g>=4)return 'tryAgain'; return 'dontGiveUp'; }
function gradeEmoji(g){ if(g===12)return '🏆'; if(g>=10)return '🌟'; if(g>=8)return '👍'; if(g>=6)return '💪'; if(g>=4)return '📚'; return '🌱'; }

function showResult(){
  if (timerInt){ clearInterval(timerInt); timerInt=null; }
  finalSec=Math.floor((Date.now()-quizStart)/1000);
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  renderResult();
}
function renderResult(){
  var total=runtime.length, percent=Math.round((firstTryCorrect/total)*100), grade=getGrade(percent);
  document.getElementById('result-title').textContent=t().resultTitle;
  document.getElementById('result-first-label').textContent=t().firstLabel;
  document.getElementById('result-first').textContent=firstTryCorrect;
  document.getElementById('result-of-total').textContent=fmt(t().ofTotal,{n:total});
  document.getElementById('result-percent-label').textContent=t().percentLabel;
  document.getElementById('result-percent').textContent=percent+'%';
  document.getElementById('result-time-label').textContent=t().timeLabel;
  document.getElementById('result-time').textContent=fmtTime(finalSec||0);
  document.getElementById('result-grade-label').textContent=t().gradeLabel;
  document.getElementById('result-grade').textContent=grade;
  document.getElementById('result-motivation').innerHTML=t().motiv[motivKey(grade)];
  document.getElementById('result-emoji').textContent=gradeEmoji(grade);
  document.getElementById('result-restart-btn').textContent=t().restartBtn;
}
function restartQuiz(){ document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }

renderStart();
</script>
